# Sluice's agent on a schedule: one round over every vault every 15 minutes.
# Each round pays bills that fit a vault's limits and proposes the rest. The
# vaults themselves remember what was settled, so nothing is stored between runs.
#
# Settings > Secrets and variables > Actions:
#   Secrets:   AGENT_PRIVATE_KEY  (required) the agent's session key, 0x...
#              ANTHROPIC_API_KEY  (optional) Claude review and plain-English reasons
#              TELEGRAM_BOT_TOKEN (optional) with TELEGRAM_CHAT_ID: alerts when something needs you
#              TELEGRAM_CHAT_ID
#              OPERATOR_TELEGRAM_CHAT_ID (optional) where operator alerts go, e.g. the agent's gas running low
#   Variables: SLUICE_FACTORY     serve every vault the factory created that gave this agent a session
#              SLUICE_VAULTS      and/or a comma-separated list of vault addresses
#              SLUICE_FROM_BLOCK  (optional) the vault's deployment block
#              SLUICE_APP_URL     (optional) the dashboard's address, linked from alerts
name: agent

on:
  schedule:
    # Off the :00/:15/:30/:45 minutes, which GitHub often delays.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide but sign nothing"
        type: boolean
        default: false

concurrency:
  group: sluice-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      # Remembers which alerts were already sent, so Telegram hears each one once.
      - uses: actions/cache/restore@v4
        with:
          path: agent/.sluice-alerts.json
          key: sluice-alerts-${{ github.run_id }}
          restore-keys: sluice-alerts-
      - name: Round
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUICE_VAULTS: ${{ vars.SLUICE_VAULTS }}
          SLUICE_FACTORY: ${{ vars.SLUICE_FACTORY }}
          SLUICE_FROM_BLOCK: ${{ vars.SLUICE_FROM_BLOCK }}
          SLUICE_APP_URL: ${{ vars.SLUICE_APP_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPERATOR_TELEGRAM_CHAT_ID: ${{ secrets.OPERATOR_TELEGRAM_CHAT_ID }}
          AEVUM_RPC_URL: https://rpc-test.qday.info
        run: |
          if { [ -z "$SLUICE_VAULTS" ] && [ -z "$SLUICE_FACTORY" ]; } || [ -z "$AGENT_PRIVATE_KEY" ]; then
            echo "::notice::AGENT_PRIVATE_KEY, or both SLUICE_FACTORY and SLUICE_VAULTS, not set yet; skipping this round."
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then npx tsx src/main.ts --dry-run; else npx tsx src/main.ts; fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: agent/.sluice-alerts.json
          key: sluice-alerts-${{ github.run_id }}
