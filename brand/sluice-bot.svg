<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14414e"/>
      <stop offset="1" stop-color="#0f2f3a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa39a"/>
      <stop offset="1" stop-color="#0b5c55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- water flowing under the gate -->
  <path d="M60 352 C112 328 150 376 206 352 S300 328 352 352 S418 376 452 352 L452 452 L60 452 Z" fill="url(#water)"/>
  <path d="M60 396 C112 372 150 420 206 396 S300 372 352 396 S418 420 452 396" fill="none" stroke="#ddedea" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
  <!-- gate posts and beam -->
  <rect x="120" y="104" width="44" height="270" rx="10" fill="#ddedea"/>
  <rect x="348" y="104" width="44" height="270" rx="10" fill="#ddedea"/>
  <rect x="100" y="96" width="312" height="40" rx="14" fill="#f6f8f7"/>
  <!-- the gate panel, raised to a set line -->
  <rect x="176" y="150" width="160" height="150" rx="12" fill="#0b5c55" stroke="#f6f8f7" stroke-width="8"/>
  <line x1="196" y1="198" x2="316" y2="198" stroke="#ddedea" stroke-width="8" stroke-linecap="round" stroke-opacity=".7"/>
  <line x1="196" y1="242" x2="316" y2="242" stroke="#ddedea" stroke-width="8" stroke-linecap="round" stroke-opacity=".7"/>
  <!-- a coin passing through the gap -->
  <circle cx="256" cy="336" r="22" fill="#c9a14a" stroke="#f6f8f7" stroke-width="6"/>
</svg>
